name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（如 v1.0.0）；留空只构建，不发布'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build single executable
        run: python scripts/build.py
      - name: Publish GitHub release
        if: "startsWith(github.ref, 'refs/tags/') || inputs.tag != ''"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release create "$TAG" dist/BulkUnzip.exe --target "$GITHUB_SHA" --title "BulkUnzip ${TAG#v}" --generate-notes
